plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.reliefparallax'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.reliefparallax"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名，方便直接安装测试
            signingConfig signingConfigs.debug
        }
        debug {
            // 默认 debug 配置
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 不压缩 assets 里的 glsl，方便运行时读取
    androidResources {
        noCompress 'glsl'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    // appcompat 传递依赖会把 kotlin-stdlib-jdk7/jdk8 1.6.x 拽进来，
    // 与 kotlin-stdlib 1.8.x 产生重复类（checkDebugDuplicateClasses 失败）。
    // 统一到 1.8.x 后 kotlin-stdlib-jdk7/jdk8 已是空壳，可消除冲突。
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22') {
            because 'unify kotlin stdlib version to avoid duplicate classes'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'unify kotlin stdlib version to avoid duplicate classes'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'unify kotlin stdlib version to avoid duplicate classes'
        }
    }
}