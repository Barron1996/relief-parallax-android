name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (use preinstalled cmdline-tools)
        run: |
          set -x
          SDK="$ANDROID_SDK_ROOT"
          ls "$SDK" || true
          SDKMGR=""
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMGR=$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          fi
          echo "sdkmanager = $SDKMGR"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$SDK" > local.properties
          ls "$SDK/platforms" && ls "$SDK/build-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: relief-parallax-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error